yaml
name: Cleanup Old Workflow Runs

on:
  schedule:
    # 建議改為每天凌晨 2 點執行，清理才及時
    - cron: '0 2 * * *'
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          
          # 1. 針對「成功」的紀錄：保留 6 天
          # 超過 6 天的成功紀錄會被刪除
          retain_days: 6
          
          # 2. 針對「失敗/取消」等紀錄：立刻刪除
          # 將此設為 0，避免因為要留數量而刪不掉失敗紀錄
          keep_minimum_runs: 0
          
          # 3. 指定要刪除的狀態清單
          # 這裡包含了所有非成功的狀態
          delete_run_by_conclusion_pattern: "action_required,cancelled,failure,skipped,stale,timed_out"


