name: Cleanup Old Workflow Runs

on:
  schedule:
    - cron: '0 2 1 * *' # 每月1號執行
  workflow_dispatch: # 讓你可以手動按按鈕執行

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }} # 自動抓你的倉庫名稱
          retain_days: 6 # 只留最近 6 天
          keep_minimum_runs: 6 # 至少留 6 個紀錄
