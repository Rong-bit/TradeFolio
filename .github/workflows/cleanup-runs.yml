yaml
name: Cleanup Old Workflow Runs

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 6
          keep_minimum_runs: 6
          # 關鍵設定：刪除除了 success 以外的所有狀態 (失敗、取消等)
          delete_run_by_conclusion_pattern: "action_required,cancelled,failure,skipped,stale,timed_out"
