<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- 禁止 iOS/Android 自動將數字辨識為電話號碼 -->
    <meta name="format-detection" content="telephone=no" />
    <!-- 修改為相對路徑，確保在子目錄下能讀取 -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3314/3314353.png">
    <title>TradeFolio - 投資資產紀錄</title>
    <!-- Tailwind CSS 保持 CDN 引入即可 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#0f172a',
              secondary: '#334155',
              accent: '#3b82f6',
              success: '#10b981',
              danger: '#ef4444',
            },
            animation: {
              'fade-in': 'fadeIn 0.2s ease-out',
              'slide-up': 'slideUp 0.3s ease-out',
              'slide-right': 'slideRight 0.3s cubic-bezier(0.4, 0, 0.2, 1)',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)' },
                '100%': { transform: 'translateY(0)' },
              },
              slideRight: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      .dark body { background-color: #0f172a; color: #e2e8f0; }
      .dark .bg-white { background-color: #1e293b !important; }
      .dark .bg-slate-50 { background-color: #0f172a !important; }
      .dark .bg-slate-100 { background-color: #1e293b !important; }
      .dark .text-slate-800 { color: #e2e8f0 !important; }
      .dark .text-slate-700 { color: #cbd5e1 !important; }
      .dark .text-slate-600 { color: #94a3b8 !important; }
      .dark .border-slate-100 { border-color: #334155 !important; }
      .dark .divide-slate-100 > * + * { border-color: #334155 !important; }
      .dark td.sticky, .dark th.sticky { background-color: #1e293b !important; }
      body, .bg-white, .bg-slate-50 { transition: background-color 0.25s, color 0.25s; }
      /* Brush 年份文字顏色 */
      .recharts-brush-texts text { fill: #475569 !important; font-size: 10px; }
      .recharts-brush-slide { fill: #e2e8f0 !important; }
      .dark .recharts-brush-texts text { fill: #cbd5e1 !important; }
      .dark .recharts-brush-slide { fill: #334155 !important; }
      /* Date input calendar icon contrast */
      input[type="date"]::-webkit-calendar-picker-indicator {
        opacity: 0.85;
      }
      .dark input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(1) brightness(1.15);
        opacity: 0.95;
      }
    </style>
    <script>
      (function() {
        const s = localStorage.getItem('tf-dark-mode');
        if (s === 'true' || (s === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.5.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.2.7",
    "uuid": "https://esm.sh/uuid@^13.0.0"
  }
}
</script>
</head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
